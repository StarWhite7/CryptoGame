@if (inGame()) { <app-game-screen /> } @else { <app-main-menu [hasSave]="game.hasSave()" (newGame)="startNewGame()" (continueGame)="continueGame()" (openSettings)="game.modal.set('settings')" (quit)="quitGame()" /> }
@if (game.modal()) { <app-modal-host (backToMenu)="backToMenu()" (quit)="quitGame()" /> }
