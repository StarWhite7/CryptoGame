<header class="panel-heading"><div><span class="eyebrow">ENTERTAINMENT DISTRICT</span><h1>Casino</h1><p>Jouez avec modération : votre capital est précieux.</p></div></header>
<section class="games"><article class="game"><span class="eyebrow">01 / HASARD</span><h2>Pile ou face</h2><output>🪙 {{ coinResult }}</output><label>Mise<input type="number" min="1" [max]="game.state().cash" [(ngModel)]="coinBet"></label><div class="actions"><button class="button" (click)="flip('pile')">Pile</button><button class="button secondary" (click)="flip('face')">Face</button></div></article>
<article class="game"><span class="eyebrow">02 / CARTES</span><h2>Blackjack simplifié</h2><output>{{ blackjackResult }}</output><label>Mise<input type="number" min="1" [max]="game.state().cash" [(ngModel)]="blackjackBet"></label><button class="button full" (click)="playBlackjack()">Jouer la main</button><p>Le plus proche de 21 sans dépasser gagne. Tirage automatique sous 16.</p></article></section>
